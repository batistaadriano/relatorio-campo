<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relatório de Campo</title>
<meta name="theme-color" content="#1D5CFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Relatório">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface2:#EEF1F5; --text:#0F172A; --muted:#64748B; --line:#E4E8EE;
  --accent:#1D5CFF; --accent-2:#1446D8; --accent-ink:#FFFFFF; --accent-text:#1D5CFF; --accent-soft:#E9F0FF;
  --ok:#16A34A; --ok-soft:#E8F7EE; --bad:#E11D48; --bad-soft:#FDECEF; --warn:#D97706; --warn-soft:#FDF3E3; --dim:#94A3B8;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 1px 1px rgba(15,23,42,.03);
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1116; --surface:#171B22; --surface2:#212733; --text:#E8ECF2; --muted:#94A0B1; --line:#283040;
    --accent:#3D6EFF; --accent-2:#1F47C9; --accent-text:#86A6FF; --accent-soft:#1A2747;
    --ok:#34C46E; --ok-soft:#143022; --bad:#FF5A7A; --bad-soft:#3A1720; --warn:#F2A33A; --warn-soft:#3A2A12; --dim:#6B778A;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1116; --surface:#171B22; --surface2:#212733; --text:#E8ECF2; --muted:#94A0B1; --line:#283040;
  --accent:#3D6EFF; --accent-2:#1F47C9; --accent-text:#86A6FF; --accent-soft:#1A2747;
  --ok:#34C46E; --ok-soft:#143022; --bad:#FF5A7A; --bad-soft:#3A1720; --warn:#F2A33A; --warn-soft:#3A2A12; --dim:#6B778A;
  --shadow:none; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,"SF Pro Text","Inter",BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
body[data-view="home"]::before{background:var(--accent)}
body[data-view="folder"]::before,body[data-view="pend"]::before,body[data-view="more"]::before{background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%;display:block}

/* cabeçalho das telas de detalhe */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);
  display:flex;align-items:center;gap:4px;padding:6px 6px;min-height:56px;border-bottom:1px solid var(--line)}
.top h1{flex:1;margin:0;font-size:14.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;text-transform:none;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;flex:none}
.icon-btn:active{background:var(--surface2)}
.icon-btn svg{width:22px;height:22px}
.icon-btn.sm{width:36px;height:36px}
.icon-btn.sm svg{width:19px;height:19px}

main{padding:12px 16px 120px;max-width:760px;margin:0 auto}

/* telas com abas: título grande */
.ltitle{padding:18px 4px 12px;display:flex;align-items:flex-end;gap:10px}
.ltitle div{flex:1;min-width:0}
.ltitle h1{margin:0;font-size:27px;font-weight:700;letter-spacing:-.02em}
.ltitle p{margin:2px 0 0;font-size:14px;color:var(--muted)}

/* início */
.hero{background:linear-gradient(165deg,var(--accent) 0%,var(--accent-2) 100%);color:#fff;
  padding:14px 18px 62px;border-radius:0 0 28px 28px}
.hero .bar{display:flex;align-items:center;gap:12px;max-width:760px;margin:0 auto}
.avatar{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-weight:700;font-size:16px;flex:none;border:1.5px solid rgba(255,255,255,.45)}
.hero .hi{flex:1;min-width:0}
.hero .hi small{display:block;font-size:12.5px;opacity:.85}
.hero .hi b{display:block;font-size:21px;font-weight:700;letter-spacing:-.01em}
.hero .co{max-width:760px;margin:12px auto 0;font-size:13px;opacity:.9;display:flex;align-items:center;gap:6px}
.hero .co svg{width:16px;height:16px}
.hero .icon-btn{color:#fff;background:rgba(255,255,255,.14)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:728px;margin:-44px auto 0;padding:0 16px;position:relative}
.qa{background:var(--surface);border-radius:16px;padding:14px;box-shadow:0 6px 18px rgba(15,23,42,.08);display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;font-weight:600;font-size:14.5px}
.qa:active{transform:scale(.98)}
.qa i{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center}
.qa i svg{width:19px;height:19px}

.sec{display:flex;justify-content:space-between;align-items:center;margin:24px 2px 10px}
.sec h2{margin:0;font-size:16.5px;font-weight:700}
.sec .link{font-size:13.5px;font-weight:600;color:var(--accent-text);display:inline-flex;align-items:center;gap:2px;min-height:36px}
.sec .link svg{width:16px;height:16px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:14px;padding:12px 12px 10px;box-shadow:var(--shadow);text-align:left}
.stat b{display:block;font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.prio{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.pr{background:var(--surface);border-radius:14px;padding:12px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;text-align:left}
.pr svg{width:16px;height:16px;flex:none}
.pr span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr b{font-size:15px;color:var(--text)}
.pr.bad{color:var(--bad)} .pr.ok{color:var(--ok)} .pr.warn{color:var(--warn)} .pr.blue{color:var(--accent-text)}

/* listas agrupadas */
.group{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.lrow{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 8px 8px 14px;text-align:left}
.lrow .main:active{background:var(--surface2)}
.ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--surface2);color:var(--muted)}
.ico svg{width:19px;height:19px}
.ico.blue{background:var(--accent-soft);color:var(--accent-text)}
.ico.bad{background:var(--bad-soft);color:var(--bad)}
.lrow .txt{flex:1;min-width:0}
.lrow .nm{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .mt{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .mt .bad{color:var(--bad);font-weight:600}
.lrow .chev{width:18px;height:18px;color:var(--dim);flex:none}
.lrow .icon-btn{color:var(--dim)}
.minibar{height:4px;border-radius:2px;background:var(--surface2);margin-top:6px;overflow:hidden;max-width:200px}
.minibar i{display:block;height:100%;background:var(--accent)}

/* breadcrumb (memória da pasta) */
.crumbs{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.crumb{display:flex;align-items:center;border-bottom:1px solid var(--line);min-height:44px;padding-right:4px}
.crumb:last-child{border-bottom:0}
.crumb .go{flex:1;min-width:0;display:flex;align-items:center;gap:8px;min-height:44px;padding:4px 12px;text-align:left;font-size:14.5px}
.crumb .go:active{background:var(--surface2)}
.crumb .go svg{width:18px;height:18px;flex:none;color:var(--muted)}
.crumb .go span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb.root .go{font-weight:600}
.crumb.current{background:var(--accent-soft)}
.crumb.current .go{font-weight:700;color:var(--accent-text)}
.crumb.current .go svg{color:var(--accent-text)}
.path{display:flex;gap:4px;align-items:center;overflow-x:auto;scrollbar-width:none;margin:0 0 12px;font-size:13px;color:var(--muted);white-space:nowrap}
.path button{padding:6px 8px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-weight:500}
.path svg{width:14px;height:14px;flex:none;color:var(--dim)}

.chips{display:flex;gap:8px;margin:14px 0 12px;overflow-x:auto;scrollbar-width:none}
.chip{padding:7px 14px;border-radius:20px;background:var(--surface);font-size:13.5px;font-weight:500;white-space:nowrap;border:1px solid var(--line)}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}

.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);margin-bottom:8px;display:block;width:100%;text-align:left}
.item{display:flex;gap:14px;padding:10px 12px;align-items:center}
.item:active{background:var(--surface2)}
.thumb{width:72px;height:72px;border-radius:12px;flex:none;object-fit:cover;background:var(--surface2)}
.thumb.empty{display:grid;place-items:center;color:var(--dim);border:1.5px dashed var(--line);background:transparent;font-size:11px}
.thumb.empty svg{width:24px;height:24px}
.item .body{min-width:0;flex:1}
.item .date{font-size:12px;color:var(--muted)}
.inum{display:inline-block;background:var(--accent-soft);color:var(--accent-text);font-weight:700;font-size:11.5px;padding:1px 7px;border-radius:6px;margin-right:6px}
.photo .cap{padding:10px 12px 12px;background:var(--surface)}
.photos{align-items:flex-start}
.photo .n b{margin-right:6px}
.photo .cap label{display:block;font-size:12.5px;font-weight:700;color:var(--accent-text);margin-bottom:5px}
.item .title{font-weight:700;font-size:15.5px;margin:1px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .desc{font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.dot.ok{background:var(--ok)} .dot.anomalia{background:var(--bad)} .dot.none{background:var(--dim)}

.empty-state{text-align:center;padding:36px 18px;color:var(--muted)}
.empty-state p{max-width:32ch;margin:0 auto 20px}
.empty-state .ico{margin:0 auto 12px;width:52px;height:52px;border-radius:16px}
.empty-state .ico svg{width:26px;height:26px}
.empty-state b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;font-weight:600;font-size:15px}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:var(--surface);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1}

/* barra de abas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:14px;font-size:11px;font-weight:500;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text);font-weight:700}
.fab-float{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:7;width:58px;height:58px;border-radius:50%;
  background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(29,92,255,.35)}
.fab-float svg{width:26px;height:26px}
.fab-float:active{transform:scale(.95)}

/* barra de ações (relatório e item) */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px 10px env(safe-area-inset-bottom,0px)}
.bottom-inner{max-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:62px}
.bottom .side{display:flex;gap:4px;align-items:center}
.bottom .side.right{justify-content:flex-end}
.text-btn{min-height:44px;padding:0 10px;border-radius:10px;font-weight:600;font-size:14px;color:var(--accent-text);display:inline-flex;align-items:center;gap:6px}
.text-btn svg{width:19px;height:19px}
.text-btn:disabled{color:var(--dim)}
.fab{width:62px;height:62px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;
  margin-top:-30px;box-shadow:0 8px 20px rgba(29,92,255,.35);border:4px solid var(--surface)}
.fab svg{width:27px;height:27px}
.fab:active{transform:scale(.96)}

.photos{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px 12px;padding:0 16px}
.photo{position:relative;flex:0 0 100%;scroll-snap-align:center;border-radius:16px;overflow:hidden;background:var(--surface2);margin:0}
.photos.multi .photo{flex-basis:88%}
.photo img{width:100%;height:auto;max-height:34vh;object-fit:contain;background:#000}
.photo .del{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:12px;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
.photo .del svg{width:20px;height:20px}
.photo .n{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:3px 9px;border-radius:8px}
.add-photo{border:2px dashed var(--line);border-radius:16px;padding:30px 16px;text-align:center;color:var(--muted);margin-bottom:12px;background:var(--surface)}
.add-photo svg{width:38px;height:38px;margin:0 auto 8px;display:block;color:var(--dim)}
.photo-actions{display:flex;gap:10px;margin-bottom:12px}
.photo-actions .btn{flex:1}

.panel{background:var(--surface);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.field{margin-bottom:16px}
.field:last-child{margin-bottom:0}
label.lb,.lb{display:block;font-size:13px;color:var(--text);margin-bottom:6px;font-weight:600}
.inp{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
textarea.inp{min-height:120px;resize:vertical;line-height:1.5}
.counter{text-align:right;font-size:12px;color:var(--muted);margin-top:4px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{min-height:46px;border-radius:12px;border:1px solid var(--line);font-weight:600;font-size:14.5px;background:var(--bg)}
.seg button.ok[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.seg button.anomalia[aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{position:relative;background:var(--surface);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;
  padding:8px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet-close{position:absolute;top:16px;right:14px;font-size:14px;font-weight:600;color:var(--muted);min-height:36px;padding:0 8px}
.sheet h2{font-size:19px;font-weight:700;margin:0 70px 14px 0}
.menu-item{display:flex;align-items:center;gap:14px;width:100%;min-height:52px;padding:0 6px;border-radius:12px;text-align:left;font-size:15.5px;font-weight:500}
.menu-item:active{background:var(--surface2)}
.menu-item svg{width:21px;height:21px;color:var(--muted);flex:none}
.menu-item.danger{color:var(--bad)} .menu-item.danger svg{color:var(--bad)}
.colchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.colchips button{font-size:13px;padding:6px 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.preview{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14px}
.preview div{padding:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preview .more{color:var(--muted)}
.check{display:flex;gap:10px;align-items:center;font-size:15px;margin:4px 0 14px}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.logo-box{display:flex;align-items:center;gap:12px}
.logo-box .lg{width:110px;height:54px;border:1px dashed var(--line);border-radius:12px;display:grid;place-items:center;background:#fff;overflow:hidden;color:#888;font-size:12px}
.logo-box .lg img{max-width:100%;max-height:100%;object-fit:contain}
.fmt{display:inline-flex;border:1px solid var(--line);border-radius:22px;overflow:hidden;margin-bottom:16px}
.fmt span{padding:8px 18px;font-size:14px;font-weight:600}
.fmt span.on{background:var(--accent);color:#fff}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;
  background:var(--text);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;max-width:90vw;text-align:center}
.hero .sync{margin-top:4px;font-size:12.5px;opacity:.95;font-weight:600}
.gprog{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin:4px 0 14px}.gprog i{display:block;height:100%;background:var(--accent)}
.gsec{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-text)}
.gq{font-size:21px;font-weight:700;line-height:1.3;margin:6px 0 14px}
.gph{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}.gph img{width:92px;height:92px;object-fit:cover;border-radius:12px;flex:none}
.insp{background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.insp-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.insp-t{font-weight:700;font-size:16.5px}.insp-s{font-size:13px;color:var(--muted)}
.ring{width:50px;height:50px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p) * 1%), var(--surface2) 0);display:grid;place-items:center;position:relative;font-size:12px;font-weight:700;flex:none}
.ring:before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--surface)}.ring span{position:relative}
.insp .row>.btn{white-space:nowrap;font-size:14px}
.inum.pend{background:var(--bad-soft);color:var(--bad)}
.wmbox{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}
.wmpg{width:110px;height:155px;flex:none;background:#fff;border:1px solid var(--line);border-radius:6px;position:relative;overflow:hidden}
.wmpg img{position:absolute;transform:translate(-50%,-50%);max-width:none}
.wmbox input[type=range]{width:100%;accent-color:var(--accent);margin:2px 0 8px}
.savechip{font-size:12px;font-weight:600;color:var(--ok);margin:2px 0 8px}.savechip.saving{color:var(--muted)}.savechip.err{color:var(--bad)}

/* ---------- IndexedDB ---------- */
let dbp;
function idb(){
  if (dbp) return dbp;
  dbp = new Promise((res, rej) => {
    let r;
    try { r = indexedDB.open('relatorio-campo', 2); } catch (e) { rej(e); return; }
    r.onupgradeneeded = ev => {
      const d = r.result, old = ev.oldVersion;
      if (old < 1) {
        d.createObjectStore('projects', {keyPath:'id'});
        const it = d.createObjectStore('items', {keyPath:'id'}); it.createIndex('projectId', 'projectId');
        const ph = d.createObjectStore('photos', {keyPath:'id'}); ph.createIndex('itemId', 'itemId'); ph.createIndex('projectId', 'projectId');
      }
      if (old < 2) {
        d.createObjectStore('folders', {keyPath:'id'});
        d.createObjectStore('settings', {keyPath:'key'});
      }
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbp;
}
const P = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
async function os(name, mode = 'readonly'){ const d = await idb(); return d.transaction(name, mode).objectStore(name); }
const getAll = async n => P((await os(n)).getAll());
const byIdx = async (n, idx, v) => P((await os(n)).index(idx).getAll(v));
const get = async (n, k) => P((await os(n)).get(k));
const APP_VERSION = 11, APP_DATE = '11/11/2026';
const SYNCED = ['folders', 'projects', 'items', 'photos'];
const rawPut = async (n, v) => P((await os(n, 'readwrite')).put(v));
const put = async (n, v) => { if (SYNCED.includes(n) && v) v.mt = Date.now(); let r; try { r = await rawPut(n, v); } catch (e) { setSaveState('err'); throw e; } cloudPush(n, [v]); if (n !== 'settings') setSaveState('ok'); return r; };
async function putMany(n, arr){ if (SYNCED.includes(n)) arr.forEach(v => { v.mt = v.mt || Date.now(); }); await rawPutMany(n, arr); cloudPush(n, arr); }
async function rawPutMany(n, arr){
  const d = await idb();
  return new Promise((res, rej) => {
    const t = d.transaction(n, 'readwrite'); const s = t.objectStore(n);
    arr.forEach(v => s.put(v));
    t.oncomplete = () => res(); t.onerror = () => rej(t.error);
  });
}
async function delMany(map){ await rawDelMany(map); cloudDelete(map); }
async function rawDelMany(map){
  const d = await idb();
  return new Promise((res, rej) => {
    const t = d.transaction(Object.keys(map), 'readwrite');
    for (const [n, ids] of Object.entries(map)) { const s = t.objectStore(n); ids.forEach(id => s.delete(id)); }
    t.oncomplete = () => res(); t.onerror = () => rej(t.error);
  });
}
const getSetting = async k => (await get('settings', k))?.value;
const setSetting = (k, v) => { if (k === 'company' && v) { v.mt = Date.now(); cloudPushCompany(v); } return rawPut('settings', {key:k, value:v}); };
async function getCompany(){ return {...COMPANY_DEFAULT, ...((await getSetting('company')) || {})}; }
async function nextDocNumber(){ const n = ((await getSetting('docSeq')) || 0) + 1; await setSetting('docSeq', n); return n; }

/* ---------- helpers ---------- */
const byOrder = (a, b) => (a.order - b.order) || (a.createdAt - b.createdAt);
const byName = (a, b) => a.name.localeCompare(b.name, 'pt-BR', {numeric:true});
const pid0 = x => x.parentId || null;
function fmtDay(ts){ const d = new Date(ts); return `${d.toLocaleDateString('pt-BR', {weekday:'short'})}, ${d.toLocaleDateString('pt-BR')}`; }
function fmtDate(ts){ return `${fmtDay(ts)} ${new Date(ts).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})}`; }
const urls = new Map();
function blobUrl(key, blob){ if (!blob) return ''; if (!urls.has(key)) urls.set(key, URL.createObjectURL(blob)); return urls.get(key); }
const phSrc = (ph, t) => (t ? ph.tsrc : (ph.src || ph.tsrc)) || blobUrl((t ? 't' : 'f') + ph.id, t ? ph.thumb : ph.blob);
function dropUrl(key){ if (urls.has(key)) { URL.revokeObjectURL(urls.get(key)); urls.delete(key); } }
let toastT;
function toast(msg, ms = 2600){
  let t = $('.toast');
  if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hidden'), ms);
}
const hideToast = () => $('.toast')?.classList.add('hidden');
function statusOf(it){ return it.status === 'ok' || it.status === 'anomalia' ? it.status : 'none'; }
const STATUS_LABEL = {ok:'Sem anomalia', anomalia:'Com anomalia', none:'Sem classificação'};
function pathTo(fid, folders){
  const m = new Map(folders.map(f => [f.id, f])); const out = []; let c = fid ? m.get(fid) : null, g = 0;
  while (c && g++ < 60) { out.unshift(c); c = c.parentId ? m.get(c.parentId) : null; }
  return out;
}
async function touchProject(pid){ const p = await get('projects', pid); if (p) { p.updatedAt = Date.now(); await put('projects', p); } }

async function processImage(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('imagem inválida')); i.src = url; });
    const make = (max, q, type = 'image/jpeg') => {
      let w = img.naturalWidth, h = img.naturalHeight;
      const s = Math.min(1, max / Math.max(w, h)); w = Math.round(w * s); h = Math.round(h * s);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      if (type === 'image/jpeg') { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); }
      ctx.drawImage(img, 0, 0, w, h);
      return Promise.resolve({d: c.toDataURL(type, q), w, h});
    };
    return {make};
  } finally { setTimeout(() => URL.revokeObjectURL(url), 5000); }
}
async function addPhotos(itemId, files){
  const it = await get('items', itemId); if (!it) return;
  for (const f of files) {
    const {make} = await processImage(f);
    const full = await make(1600, .78), th = await make(320, .7);
    const ph = {id: uid(), itemId, projectId: it.projectId, src: full.d, tsrc: th.d, srcV: uid(), w: full.w, h: full.h, takenAt: Date.now()};
    await put('photos', ph);
    it.photoIds = [...(it.photoIds || []), ph.id];
  }
  const cur = (await get('items', itemId)) || it; const added = it.photoIds.filter(x => !(cur.photoIds || []).includes(x));
  cur.photoIds = [...(cur.photoIds || []), ...added]; cur.updatedAt = Date.now(); await put('items', cur); await touchProject(it.projectId);
}
async function createProject(name, parentId){
  const p = {id: uid(), name, parentId: parentId || null, defaultDesc:'', docNumber: await nextDocNumber(), createdAt: Date.now(), updatedAt: Date.now()};
  await put('projects', p); return p;
}
async function createItem(pid, fields = {}){
  const p = await get('projects', pid);
  const sib = await byIdx('items', 'projectId', pid);
  const maxOrder = sib.reduce((m, x) => Math.max(m, x.order || 0), 0);
  const it = {id: uid(), projectId: pid, order: maxOrder + 1, title: fields.title ?? '', desc: fields.desc ?? (p?.defaultDesc || ''),
    status: null, photoIds: [], createdAt: Date.now(), updatedAt: Date.now()};
  await put('items', it); await touchProject(pid); return it;
}

/* ---------- downloads ---------- */
async function saveFile(filename, data){
  // Versão instalada: entrega o arquivo pela folha de compartilhar do iPhone (Arquivos, WhatsApp, e-mail…)
  const type = /\.pdf$/i.test(filename) ? 'application/pdf' : /\.xlsx$/i.test(filename) ? 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' : /\.json$/i.test(filename) ? 'application/json' : 'application/octet-stream';
  const blob = data instanceof Blob ? new Blob([data], {type}) : new Blob([data], {type});
  const file = new File([blob], filename, {type});
  const url = URL.createObjectURL(blob);
  const canShare = !!(navigator.canShare && navigator.canShare({files:[file]}));
  openSheet(`<h2>Arquivo pronto</h2><p class="hint" style="margin:-6px 0 16px">${esc(filename)}</p>
    ${canShare ? `<button class="btn primary block" data-c="share" style="margin-bottom:10px">${I.upload}Compartilhar ou salvar em Arquivos</button>` : ''}
    <a class="btn ${canShare ? 'ghost' : 'primary'} block" href="${url}" download="${esc(filename)}" target="_blank" rel="noopener" style="text-decoration:none">${I.save}Abrir / baixar</a>`,
    s => s.addEventListener('click', async ev => {
      const b = ev.target.closest('[data-c="share"]'); if (!b) return;
      try { await navigator.share({files:[file], title: filename}); closeSheet(); }
      catch (e) { if (e && e.name !== 'AbortError') toast('Não foi possível compartilhar. Use “Abrir / baixar”.'); }
    }));
  return true;
}

/* ---------- sheets ---------- */
function openSheet(html, onMount){
  closeSheet();
  const b = document.createElement('div'); b.className = 'backdrop'; b.id = 'backdrop';
  b.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><button class="sheet-close" data-close>Fechar</button>${html}</div>`;
  b.querySelector('[data-close]').addEventListener('click', closeSheet);
  b.addEventListener('click', e => { if (e.target === b) closeSheet(); });
  document.body.appendChild(b);
  onMount && onMount(b.firstElementChild);
  return b.firstElementChild;
}
function closeSheet(){ $('#backdrop')?.remove(); }
function menu(title, entries){
  const html = (title ? `<h2>${esc(title)}</h2>` : '') + entries.map((e, i) =>
    `<button class="menu-item ${e.danger ? 'danger' : ''}" data-mi="${i}">${I[e.icon] || ''}<span>${esc(e.label)}</span></button>`).join('');
  openSheet(html, s => s.addEventListener('click', ev => {
    const b = ev.target.closest('[data-mi]'); if (!b) return; closeSheet(); entries[+b.dataset.mi].run();
  }));
}
function confirmSheet(title, text, okLabel, run){
  openSheet(`<h2>${esc(title)}</h2><p class="hint" style="margin-bottom:18px">${esc(text)}</p>
    <div class="row"><button class="btn ghost" data-c="no">Cancelar</button><button class="btn danger" data-c="yes">${esc(okLabel)}</button></div>`,
    s => s.addEventListener('click', ev => { const b = ev.target.closest('[data-c]'); if (!b) return; closeSheet(); if (b.dataset.c === 'yes') run(); }));
}
function promptSheet(title, label, value, okLabel, run, multiline = false){
  const field = multiline ? `<textarea class="inp" id="ps-v">${esc(value)}</textarea>` : `<input class="inp" id="ps-v" value="${esc(value)}" maxlength="100">`;
  openSheet(`<h2>${esc(title)}</h2><div class="field"><label class="lb" for="ps-v">${esc(label)}</label>${field}</div>
    <div class="row"><button class="btn ghost" data-c="no">Cancelar</button><button class="btn primary" data-c="yes">${esc(okLabel)}</button></div>`,
    s => {
      const inp = $('#ps-v', s); if (!multiline) setTimeout(() => inp.focus(), 50);
      s.addEventListener('click', ev => {
        const b = ev.target.closest('[data-c]'); if (!b) return;
        const v = inp.value.trim();
        if (b.dataset.c === 'yes') { if (!v && !multiline) { inp.focus(); return; } closeSheet(); run(v); } else closeSheet();
      });
    });
}

/* ---------- routing + memória ---------- */
const app = $('#app');
let view = {name:'home'};
const TAB_VIEWS = ['home', 'folder', 'pend', 'more'];
function go(v){
  view = v;
  setSetting('lastView', {name: v.name, id: v.id || null}).catch(() => {});
  render().then(() => window.scrollTo(0, 0));
}
async function render(){
  document.body.dataset.view = view.name;
  try {
    if (view.name === 'home') await renderHome();
    else if (view.name === 'folder') await renderFolder();
    else if (view.name === 'pend') await renderPend();
    else if (view.name === 'more') await renderMore();
    else if (view.name === 'project') await renderProject();
    else if (view.name === 'item') await renderItem();
    else if (view.name === 'guide') await renderGuide();
    else if (view.name === 'fill') await renderFill();
    setSaveState();
  } catch (e) {
    console.error(e);
    app.innerHTML = `<main><div class="empty-state"><p>O armazenamento do aparelho não respondeu. Feche e abra o app de novo.</p><p class="hint">${esc(e.message)}</p></div></main>`;
  }
}
function tabsHtml(active){
  const t = [['home', 'Início', I.home], ['folder', 'Pastas', I.folderO], ['pend', 'Pendências', I.flag], ['more', 'Mais', I.grid]];
  return `<nav class="tabs" aria-label="Navegação"><div class="tabs-inner">${t.map(([k, l, ic]) =>
    `<button class="tab" data-act="tab" data-tab="${k}" ${k === active ? 'aria-current="page"' : ''}>${ic}<span>${l}</span></button>`).join('')}</div></nav>`;
}
const chev = `<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>`;

function crumbsHtml(company, path, project){
  const levels = [{kind:'root', id:'', name: company.name || 'Minha empresa'}, ...path.map(f => ({kind:'folder', id:f.id, name:f.name}))];
  if (project) levels.push({kind:'report', id: project.id, name: project.name});
  return `<nav class="crumbs" aria-label="Caminho">${levels.map((l, i) => {
    const cur = i === levels.length - 1;
    const icon = l.kind === 'root' ? I.case : cur ? I.arrow : I.sub;
    const lead = l.kind === 'root' ? '' : (!cur ? I.folderO : '');
    const pad = l.kind === 'root' ? 12 : 12 + Math.min(i - 1, 5) * 12;
    const act = l.kind === 'report' ? `data-act="open-project" data-id="${l.id}"` : `data-act="folder" data-id="${l.id}"`;
    const infoAct = l.kind === 'root' ? 'company' : l.kind === 'folder' ? 'folder-info' : 'project-menu';
    return `<div class="crumb ${l.kind === 'root' ? 'root' : ''} ${cur ? 'current' : ''}">
      <button class="go" style="padding-left:${pad}px" ${act} ${cur ? 'aria-current="page"' : ''}>${icon}${lead}<span>${esc(l.name)}</span></button>
      ${cur ? `<button class="icon-btn sm" data-act="${infoAct}" data-id="${l.id}" aria-label="Opções de ${esc(l.name)}">${I.info}</button>` : ''}</div>`;
  }).join('')}</nav>`;
}

async function loadAll(){
  const [folders, projects, items, company] = await Promise.all([getAll('folders'), getAll('projects'), getAll('items'), getCompany()]);
  const st = {};
  for (const it of items) { const s = st[it.projectId] ||= {t:0, p:0, b:0}; s.t++; if ((it.photoIds || []).length) s.p++; if (it.status === 'anomalia') s.b++; }
  return {folders, projects, items, company, st};
}
function reportRow(p, s, folders, opts = {}){
  s = s || {t:0, p:0, b:0};
  const pct = s.t ? Math.round(s.p / s.t * 100) : 0;
  const where = opts.showPath ? pathTo(pid0(p), folders).map(f => f.name).join(' › ') : '';
  return `<div class="lrow"><button class="main" data-act="open-project" data-id="${p.id}"><span class="ico blue">${I.clip}</span>
    <div class="txt"><div class="nm">${esc(p.name)}</div>
    <div class="mt">${where ? esc(where) + '  ·  ' : ''}${s.p} de ${s.t} com foto${s.b ? `, <span class="bad">${s.b} com anomalia</span>` : ''}</div>
    ${!opts.showPath && s.t ? `<div class="minibar"><i style="width:${pct}%"></i></div>` : ''}</div>${opts.menu ? '' : chev}</button>
    ${opts.menu ? `<button class="icon-btn" data-act="project-menu" data-id="${p.id}" aria-label="Opções">${I.more}</button>` : ''}</div>`;
}

    cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px'; cv.width = Math.round(W * s * devicePixelRatio); cv.height = Math.round(H * s * devicePixelRatio); draw(ctx, cv.width / W); };
  function shape(c, sh, k){

    if (sh.tool === 'rect') c.strokeRect(Math.min(a.x, b.x) * k, Math.min(a.y, b.y) * k, Math.abs(b.x - a.x) * k, Math.abs(b.y - a.y) * k);
    if (sh.tool === 'circle') { c.beginPath(); c.ellipse((a.x + b.x) / 2 * k, (a.y + b.y) / 2 * k, Math.abs(b.x - a.x) / 2 * k + 1, Math.abs(b.y - a.y) / 2 * k + 1, 0, 0, 7); c.stroke(); }

async function thumbOf(src){

async function wmProcess(file){
  const {make} = await processImage(file); const r = await make(900, 1, 'image/png');
  const im = await new Promise(res => { const i = new Image(); i.onload = () => res(i); i.src = r.d; });
  const c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight; const x = c.getContext('2d'); x.drawImage(im, 0, 0);
  const d = x.getImageData(0, 0, c.width, c.height), p = d.data;
  for (let i = 0; i < p.length; i += 4) { const lum = .3 * p[i] + .59 * p[i + 1] + .11 * p[i + 2]; p[i + 3] = Math.min(p[i + 3], 255 - lum); p[i] = 110; p[i + 1] = 116; p[i + 2] = 124; }
  x.putImageData(d, 0, 0); return {d: c.toDataURL('image/png'), w: c.width, h: c.height};
}

async function moveSheet(kind, id){
  const folders = await getAll('folders');
  const banned = new Set();
  if (kind === 'folder') { banned.add(id); let added = true; while (added) { added = false; for (const f of folders) if (!banned.has(f.id) && banned.has(f.parentId)) { banned.add(f.id); added = true; } } }
  const tree = []; const walk = (pid, depth) => folders.filter(f => pid0(f) === pid).sort(byName).forEach(f => { if (banned.has(f.id)) return; tree.push({f, depth}); walk(f.id, depth + 1); });
  walk(null, 0);
  const company = await getCompany();
  openSheet(`<h2>Mover para</h2><button class="menu-item" data-to="">${I.case}<span>${esc(company.name || 'Início')}</span></button>` +
    tree.map(t => `<button class="menu-item" data-to="${t.f.id}" style="padding-left:${18 + t.depth * 16}px">${I.folderO}<span>${esc(t.f.name)}</span></button>`).join(''),
    s => s.addEventListener('click', async ev => {
      const b = ev.target.closest('[data-to]'); if (!b) return;
      const to = b.dataset.to || null;
      const rec = await get(kind === 'folder' ? 'folders' : 'projects', id);
      rec.parentId = to; await put(kind === 'folder' ? 'folders' : 'projects', rec);
      closeSheet(); toast('Movido.'); render();
    }));
}
async function deleteFolderDeep(fid){
  const folders = await getAll('folders'), projects = await getAll('projects');
  const fset = new Set([fid]); let added = true;
  while (added) { added = false; for (const f of folders) if (!fset.has(f.id) && fset.has(f.parentId)) { fset.add(f.id); added = true; } }
  const pids = projects.filter(p => fset.has(p.parentId)).map(p => p.id);
  const items = [], photos = [];

  await delMany({folders:[...fset], projects:pids, items, photos});
}

  const fill = (tpl, h, row) => tpl.replace(/\{([^}]+)\}/g, (m, n) => { const i = h.indexOf(n.trim()); return i >= 0 ? (row[i] || '') : m; }).replace(/\s+/g, ' ').trim();

    <div class="field" id="im-newwrap"><label class="lb" for="im-name">Nome do novo relatório</label><input class="inp" id="im-name" value="${esc(baseName)}" maxlength="100"></div>
    <div class="field"><label class="lb" for="im-tpl">Modelo do título</label><input class="inp" id="im-tpl" autocomplete="off">
      <p class="hint">Toque numa coluna para inserir. O texto entre chaves é trocado pelo valor de cada linha.</p><div class="colchips" id="im-cols"></div></div>
    <div class="field"><label class="lb" for="im-desc">Descrição</label><select class="inp" id="im-desc"></select></div>
    <div class="field"><span class="lb">Prévia dos títulos</span><div class="preview" id="im-prev"></div></div>
    <button class="btn primary block" id="im-go"></button>`);
  const q = id => $(id, s);
  const elHead = q('#im-head'), elProj = q('#im-proj'), elNewWrap = q('#im-newwrap'), elName = q('#im-name'),
        elTpl = q('#im-tpl'), elCols = q('#im-cols'), elDesc = q('#im-desc'), elPrev = q('#im-prev'), elGo = q('#im-go');
  function setup(){
    const h = headersFor(); elTpl.value = guessTemplate(h);
    elCols.innerHTML = h.map(c => `<button type="button" data-col="${esc(c)}">${esc(c)}</button>`).join('');
    const dg = h.findIndex(x => /descri/i.test(x));
    elDesc.innerHTML = `<option value="-1">Usar a descrição padrão do relatório</option>` + h.map((c, i) => `<option value="${i}" ${i === dg ? 'selected' : ''}>Coluna “${esc(c)}”</option>`).join('');
    upd();
  }
  function upd(){
    const h = headersFor(); const titles = dataRows().map(r => fill(elTpl.value, h, r)).filter(Boolean);
    elPrev.innerHTML = titles.slice(0, 4).map(t => `<div>${esc(t)}</div>`).join('') + (titles.length > 4 ? `<div class="more">e mais ${titles.length - 4}</div>` : '') + (titles.length ? '' : '<div class="more">Nenhum título gerado</div>');
    elGo.textContent = `Criar ${titles.length} ${titles.length === 1 ? 'item' : 'itens'}`; elGo.disabled = !titles.length;
  }
  elNewWrap.classList.toggle('hidden', elProj.value !== '__new');
  elProj.addEventListener('change', () => elNewWrap.classList.toggle('hidden', elProj.value !== '__new'));
  elHead.addEventListener('change', () => { state.hasHeader = elHead.checked; setup(); });
  elTpl.addEventListener('input', upd);
  elCols.addEventListener('click', e => {
    const b = e.target.closest('[data-col]'); if (!b) return;
    const ins = `{${b.dataset.col}}`, st = elTpl.selectionStart ?? elTpl.value.length, en = elTpl.selectionEnd ?? st;
    const pre = elTpl.value.slice(0, st); elTpl.value = pre + (pre && !/\s$/.test(pre) ? ' ' : '') + ins + elTpl.value.slice(en); upd();
  });
  elGo.addEventListener('click', async () => {
    elGo.disabled = true;
    const h = headersFor(), di = +elDesc.value;
    let pid = elProj.value;
    if (pid === '__new') pid = (await createProject(elName.value.trim() || baseName, importFolder)).id;
    const proj = await get('projects', pid);
    let order = (await byIdx('items', 'projectId', pid)).reduce((m, x) => Math.max(m, x.order || 0), 0);
    const now = Date.now();
    const list = dataRows().map(r => ({r, t: fill(elTpl.value, h, r)})).filter(x => x.t).map((x, k) => ({
      id: uid(), projectId: pid, order: ++order, title: x.t.slice(0, 100), desc: di >= 0 && x.r[di] ? x.r[di].slice(0, 1000) : (proj.defaultDesc || ''),
      status: null, photoIds: [], createdAt: now + k, updatedAt: now + k}));
    await putMany('items', list); await touchProject(pid);
    closeSheet(); toast(`${list.length} itens criados.`); go({name:'project', id: pid});
  });
  setup();
}

const WINANSI = '€‚ƒ„…†‡ˆ‰Š‹ŒŽ‘’“”•–—˜™š›œžŸ';
const PDF_MAP = {'−':'-','Ω':'Ohm','Ω':'Ohm','≤':'<=','≥':'>=','≈':'~','√':'raiz','Δ':'Delta','φ':'fi','θ':'teta','→':'->','✓':'OK'};
const pdfSafe = s => String(s ?? '').replace(/[^\x00-\xFF]/g, c => PDF_MAP[c] || (WINANSI.includes(c) ? c : '?')).replace(/³/g, '3');

async function makePdf(pid, opts){
  if (!window.jspdf) { toast('O gerador de PDF não carregou. Feche e abra o app de novo.'); return; }
  toast('Processando imagens…', 120000);
  try {
    const {jsPDF} = window.jspdf;
    const doc = new jsPDF({unit:'mm', format:'a4', compress:true});
    const W = 210, H = 297, M = 14, CW = W - 2 * M;
    const p = await get('projects', pid);
    const company = await getCompany();
    const folder = p.parentId ? await get('folders', p.parentId) : null;
    const items = (await byIdx('items', 'projectId', pid)).sort(byOrder);
    const pm = new Map((await byIdx('photos', 'projectId', pid)).map(x => [x.id, x]));
    const COL = {ok:[44,138,85], anomalia:[196,64,44], none:[140,146,151]};

    // monta as linhas: uma por foto
    const entries = [];
    items.forEach((it, ii) => {
      const num = ii + 1;
      const phs = (it.photoIds || []).map(id => pm.get(id)).filter(Boolean);
      if (!phs.length) { if (opts.includeEmpty) entries.push({it, ph:null, k:0, of:0, num}); return; }
      phs.forEach((ph, k) => entries.push({it, ph, k, of: phs.length, num}));
    });
    const nItems = new Set(entries.map(x => x.it.id)).size;
    if (!entries.length) { hideToast(); toast('Nenhuma foto para colocar no relatório.'); return; }

    let logo = null;
    if (company.logo) { try { logo = {data: company.logo.d || await blobToDataURL(company.logo.blob), w: company.logo.w, h: company.logo.h}; } catch (e) { logo = null; } }
    const fitFont = (text, maxW, size, min) => {
      let s = size; doc.setFontSize(s);
      while (doc.getTextWidth(text) > maxW && s > min) { s -= .25; doc.setFontSize(s); }
      if (doc.getTextWidth(text) > maxW) { while (text.length > 1 && doc.getTextWidth(text + '…') > maxW) text = text.slice(0, -1); text += '…'; }
      return text;
    };

    const HEAD_BOTTOM = 40, FOOT_TOP = H - 20;
    function header(){
      // logo
      const lx = M, ly = 10, lw = 30, lh = 16;
      if (logo) { const sc = Math.min(lw / logo.w, lh / logo.h); doc.addImage(logo.data, 'PNG', lx, ly + (lh - logo.h * sc) / 2, logo.w * sc, logo.h * sc, 'logo', 'FAST'); }
      else {
        doc.setFillColor(28, 30, 33); doc.roundedRect(lx, ly + 2, lw, lh - 4, 1.5, 1.5, 'F');
        doc.setTextColor(245, 179, 1); doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
        const ini = (company.name || 'R').split(/\s+/).filter(w => w.length > 2).slice(0, 2).map(w => w[0]).join('').toUpperCase() || 'R';
        doc.text(pdfSafe(ini), lx + lw / 2, ly + lh / 2 + 1.4, {align:'center'});
      }
      const rowsL = [['Companhia:', company.name], ['Contato:', company.contact], ['Fone:', company.phone], ['E-mail:', company.email]];
      const rowsR = [['Título:', p.name], ['Grupo:', (folder?.name || '—') + (p.template && p.template !== 'ensaio' ? ' · ' + tplOf(p).name : '')], ['Criado:', fmtDay(p.createdAt)], ['Nº de itens:', String(nItems) + (entries.length !== nItems ? ' (' + entries.length + ' fotos)' : '')]];
      const draw = (rows, x, lab, valW) => rows.forEach(([l, v], i) => {
        const y = 14 + i * 5;
        doc.setFont('helvetica', 'bold'); doc.setFontSize(8.2); doc.setTextColor(25); doc.text(l, x, y);
        doc.setFont('helvetica', 'normal'); doc.setTextColor(45);
        const t = fitFont(pdfSafe(v || '—'), valW, 8.2, 6.5); doc.text(t, x + lab, y);
      });
      draw(rowsL, M + 35, 19, 58);
      draw(rowsR, M + 118, 18, CW - 118 - 18);
      doc.setDrawColor(245, 179, 1); doc.setLineWidth(.8); doc.line(M, 35, W - M, 35);
      doc.setLineWidth(.2);
    }
    function footer(pg, total){
      doc.setDrawColor(190); doc.setLineWidth(.2); doc.line(M, FOOT_TOP, W - M, FOOT_TOP);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(70);
      doc.text(doc.splitTextToSize(pdfSafe(company.address || ''), 120).slice(0, 2), M, FOOT_TOP + 5);
      doc.text(pdfSafe(`Doc. Identidade ${p.docNumber || ''}`), W - M, FOOT_TOP + 5, {align:'right'});
      doc.text(`página ${pg} de ${total}`, W - M, FOOT_TOP + 9, {align:'right'});
    }

    const per = opts.perPage || 4;
    const areaH = FOOT_TOP - 4 - HEAD_BOTTOM;
    const rowH = areaH / per;
    const numW = 12, gap = 6;
    const photoW = opts.showText ? Math.min(92, (CW - numW) * (per <= 2 ? .62 : .52)) : CW - numW;
    const photoH = rowH - 5;
    const tx = M + numW + photoW + gap, tw = W - M - tx;

    for (let e = 0; e < entries.length; e++) {
      const slot = e % per;
      if (slot === 0) { if (e > 0) doc.addPage(); header(); }
      const {it, ph, k, of, num} = entries[e];
      const label = k === 0 ? String(num) : num + '.' + k;
      const y = HEAD_BOTTOM + slot * rowH;
      const st = statusOf(it);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(60);
      doc.text(`(${label})`, M, y + 4);
      // moldura da foto
      const px = M + numW;
      doc.setFillColor(242, 243, 244); doc.rect(px, y, photoW, photoH, 'F');
      if (ph) {
        const sc = Math.min(photoW / ph.w, photoH / ph.h); const w = ph.w * sc, h = ph.h * sc;
        let pdata = null;
        try { pdata = ph.src || await blobToDataURL(ph.blob); } catch (err) { pdata = null; }
        if (pdata) doc.addImage(pdata, 'JPEG', px + (photoW - w) / 2, y + (photoH - h) / 2, w, h, undefined, 'FAST');
        else { doc.setTextColor(150); doc.setFontSize(9); doc.text('Foto indisponível', px + photoW / 2, y + photoH / 2 + 1, {align:'center'}); }
      } else {
        doc.setTextColor(150); doc.setFontSize(9); doc.text('Sem foto', px + photoW / 2, y + photoH / 2 + 1, {align:'center'});
      }
      if (opts.showText) {
        let ty = y + 4;
        doc.setFillColor(...COL[st]); doc.rect(tx - 3, y, .9, photoH, 'F');
        {
          const ttl = (k === 0 ? 'Item ' : 'Foto ') + label + (it.title ? ' – ' + it.title : '');
          doc.setFont('helvetica', 'bold'); doc.setFontSize(k === 0 ? 10.5 : 9.5); doc.setTextColor(k === 0 ? 20 : 70);
          const tl = doc.splitTextToSize(pdfSafe(ttl), tw).slice(0, 3);
          doc.text(tl, tx, ty); ty += tl.length * (k === 0 ? 4.6 : 4.2) + 1.2;
        }
        doc.setFontSize(8.3); doc.setFont('helvetica', 'bold'); doc.setTextColor(25);
        doc.text('Criado:', tx, ty); doc.setFont('helvetica', 'normal'); doc.setTextColor(60);
        doc.text(pdfSafe(fmtDate(ph ? ph.takenAt : it.createdAt)), tx + 12, ty); ty += 4.6;
        if (st !== 'none' && k === 0) {
          doc.setFillColor(...COL[st]); doc.circle(tx + 1.3, ty - 1.1, 1.3, 'F');
          doc.setFont('helvetica', 'bold'); doc.setTextColor(...COL[st]); doc.text(STATUS_LABEL[st], tx + 4, ty); ty += 5;
        }
        const tplP = tplOf(p);
        if (k === 0 && tplP.fields.length) {
          const fl = it.fields || {};
          const vals = tplP.fields.map(f => [(f.pl ? f.pl + (/\((.*)\)$/.test(f.l) ? ' (' + f.l.match(/\((.*)\)$/)[1] + ')' : '') : f.l), fieldValue(f, fl)]).filter(x => x[1]);
          const cols = vals.length > 4 ? 2 : 1, cw2 = tw / cols;
          doc.setFontSize(8);
          vals.forEach(([l, v], i) => {
            const cx = tx + (i % cols) * cw2, cy = ty + Math.floor(i / cols) * 3.9;
            if (cy > y + photoH - 2) return;
            doc.setFont('helvetica', 'bold'); doc.setTextColor(25); const lt = pdfSafe(l.replace(/ \(.*\)$/, '') + ':');
            doc.text(lt, cx, cy); const lw2 = doc.getTextWidth(lt) + 1;
            doc.setFont('helvetica', 'normal'); doc.setTextColor(50);
            doc.text(fitFont(pdfSafe(v + (/\((.*)\)$/.test(l) ? ' ' + l.match(/\((.*)\)$/)[1] : '')), cw2 - lw2 - 2, 8, 6.5), cx + lw2, cy);
          });
          ty += Math.ceil(vals.length / cols) * 3.9 + 1.5;
        }
        if (ph && ph.note) {
          doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(20);
          const nl = doc.splitTextToSize(pdfSafe('Obs.: ' + ph.note), tw).slice(0, 3);
          doc.text(nl, tx, ty + 0.5); ty += nl.length * 4.4 + 1.5;
        }
        if (it.desc && k === 0) {
          doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(50);
          const maxLines = Math.max(1, Math.floor((y + photoH - ty) / 4.1));
          let dl = doc.splitTextToSize(pdfSafe(it.desc), tw);
          if (dl.length > maxLines) { dl = dl.slice(0, maxLines); dl[maxLines - 1] = dl[maxLines - 1].replace(/\s*\S*$/, '') + '…'; }
          doc.text(dl, tx, ty + 1, {lineHeightFactor:1.3});
        }
      }
    }
    const total = doc.getNumberOfPages();
    for (let pg = 1; pg <= total; pg++) { doc.setPage(pg); footer(pg, total); }
    hideToast();
    if (await saveFile(opts.filename, doc.output('blob'))) toast('PDF pronto.');
  } catch (e) { console.error(e); toast('Falha ao gerar o PDF: ' + e.message, 4000); }
}

async function doBackup(){
  toast('Preparando backup…', 120000);
  try {
    const [folders, projects, items, photos, settings] = await Promise.all(['folders', 'projects', 'items', 'photos', 'settings'].map(getAll));
    const ph = [];
    for (const x of photos) {
      if (x.src) { ph.push(x); continue; }
      try { ph.push({...x, src: await blobToDataURL(x.blob), tsrc: await blobToDataURL(x.thumb), blob: undefined, thumb: undefined}); } catch (err) {}
    }
    const st = [];
    for (const x of settings) {
      if (x.key === 'company' && x.value?.logo && !x.value.logo.d) {
        try { st.push({key:x.key, value:{...x.value, logo:{d: await blobToDataURL(x.value.logo.blob), w: x.value.logo.w, h: x.value.logo.h}}}); }
        catch (err) { st.push({key:x.key, value:{...x.value, logo:null}}); }
      } else st.push(x);
    }
    const data = JSON.stringify({app:'relatorio-campo', version:2, exportedAt: Date.now(), folders, projects, items, photos: ph, settings: st});
    hideToast();
    if (await saveFile(`backup-relatorio-${new Date().toISOString().slice(0, 10)}.json`, new Blob([data]))) toast('Backup salvo.');
  } catch (e) { toast('Falha no backup: ' + e.message); }
}
function dataURLToBlob(u){
  const [h, b64] = u.split(','); const mime = (h.match(/data:([^;]+)/) || [])[1] || 'image/jpeg';
  const bin = atob(b64); const arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type: mime});
}
async function restoreBackup(file){
  try {
    const j = JSON.parse(await file.text());
    if (j.app !== 'relatorio-campo') throw new Error('arquivo não é um backup deste app');
    await putMany('folders', j.folders || []);
    await putMany('projects', j.projects || []);
    await putMany('items', j.items || []);
    await putMany('photos', (j.photos || []).map(x => x.src ? x : ({...x, src: x.blob, tsrc: x.thumb, blob: undefined, thumb: undefined})));
    await putMany('settings', (j.settings || []).filter(x => x.key !== 'lastView').map(x => x.key === 'company' && x.value?.logo && !x.value.logo.d ? {key:x.key, value:{...x.value, logo:{d: x.value.logo.blob, w: x.value.logo.w, h: x.value.logo.h}}} : x));
    toast(`Backup restaurado: ${(j.projects || []).length} relatórios.`); go({name:'folder', id:null});
  } catch (e) { toast('Não foi possível restaurar: ' + e.message, 4000); }
}

let camTarget = null;

const curFolder = async () => view.name === 'folder' ? (view.id || null) : view.name === 'project' ? pid0((await get('projects', view.id)) || {}) : null;
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled || b.closest('.sheet')) return;
  const act = b.dataset.act, id = b.dataset.id;
  // O iPhone só abre câmera/galeria/arquivos se o clique acontecer na hora do toque, sem esperar nada antes
  if (act === 'cam-new' || act === 'cam-add' || act === 'gal-add') {
    camTarget = act === 'cam-new' ? 'new' : view.id;
    const inp = $(act === 'gal-add' ? '#in-gal' : '#in-cam'); inp.value = ''; inp.click();
    if (view.name === 'item') saveFields();
    return;
  }
  if (act === 'cam-step' || act === 'gal-step') {
    camTarget = 'step:' + b.dataset.key;
    const inp = $(act === 'gal-step' ? '#in-gal' : '#in-cam'); inp.value = ''; inp.click(); flushGuideFields(); return;
  }
  if (act === 'import') {
    if (view.name === 'item') saveFields();
    startImport(view.name === 'project' ? view.id : null, curFolderId);
    return;
  }
  if (act === 'restore') { const i = $('#in-backup'); i.value = ''; i.click(); return; }
  if (view.name === 'item') await saveFields();
  switch (act) {
    case 'tab': go({name: b.dataset.tab, id: null}); break;
    case 'cloud-login': loginSheet(); break;
    case 'team': teamSheet(); break;
    case 'cloud-logout': cloudLogout(); break;
    case 'pend-filter': view = {name:'pend', filter: b.dataset.f}; setSetting('lastView', {name:'pend', id:null}).catch(() => {}); render().then(() => window.scrollTo(0, 0)); break;
    case 'template': downloadTemplate(); break;
    case 'backup': doBackup(); break;
    case 'folder': go({name:'folder', id: id || null}); break;
    case 'open-project': go({name:'project', id}); break;
    case 'open-item': go({name:'item', id}); break;
    case 'goto': if (id) go({name:'item', id}); break;
    case 'filter': view.filter = b.dataset.f; render(); break;
    case 'company': companySheet(); break;
    case 'new-folder': { const fid = await curFolder();
      promptSheet('Nova pasta', 'Nome da pasta', '', 'Criar pasta', async name => { await put('folders', {id: uid(), name, parentId: fid, createdAt: Date.now()}); render(); }); break; }
    case 'new-report': { const fid = await curFolder();
      newReportSheet(fid); break; }
    case 'add-menu':
      menu('', [
        {icon:'folder', label:'Nova pasta', run: () => document.dispatchEvent(new CustomEvent('act', {detail:'new-folder'}))},
        {icon:'clip', label:'Novo relatório', run: () => document.dispatchEvent(new CustomEvent('act', {detail:'new-report'}))},
        {icon:'sheet', label:'Relatório a partir de planilha', run: () => startImport(null, curFolderId)}
      ]); break;
    case 'import': view.name === 'project' ? startImport(view.id, await curFolder()) : startImport(null, await curFolder()); break;
    case 'app-menu':
      menu('', [
        {icon:'case', label:'Dados da empresa', run: companySheet},
        {icon:'save', label:'Baixar planilha modelo', run: downloadTemplate},
        {icon:'save', label:'Fazer backup de tudo', run: doBackup},
        {icon:'upload', label:'Restaurar backup', run: () => { const i = $('#in-backup'); i.value = ''; i.click(); }}
      ]); break;
    case 'folder-info': {
      if (!id) { companySheet(); break; }
      const f = await get('folders', id);
      menu(f.name, [
        {icon:'pdf', label:'Gerar relatório da pasta (tudo junto)', run: () => compileSheet(f.id)},
        {icon:'img', label:'Plantas do projeto (para croqui)', run: () => plantsSheet(f.id)},
        {icon:'img', label: f.logo ? 'Trocar logo do cliente' : 'Logo do cliente (aparece no relatório)', run: () => { flogoTarget = f.id; $('#in-flogo').value = ''; $('#in-flogo').click(); }},
        ...(f.logo ? [{icon:'trash', label:'Remover logo do cliente', run: async () => { delete f.logo; await put('folders', f); toast('Logo removido.'); }}] : []),
        {icon:'edit', label:'Renomear pasta', run: () => promptSheet('Renomear pasta', 'Nome da pasta', f.name, 'Salvar', async v => { f.name = v; await put('folders', f); render(); })},
        {icon:'move', label:'Mover para…', run: () => moveSheet('folder', f.id)},
        {icon:'trash', label:'Excluir pasta', danger:true, run: () => confirmSheet('Excluir pasta?', `“${f.name}”, as subpastas, os relatórios e as fotos dentro dela serão apagados deste aparelho.`, 'Excluir', async () => {
          const parent = pid0(f); await deleteFolderDeep(f.id); go({name:'folder', id: parent}); })}
      ]); break;
    }
    case 'project-menu': {
      const p = await get('projects', id || view.id);
      menu(p.name, [
        ...(view.name !== 'project' ? [{icon:'clip', label:'Abrir relatório', run: () => go({name:'project', id: p.id})}] : []),
        {icon:'pdf', label:'Compartilhar PDF', run: () => shareSheet(p.id)},
        {icon:'sheet', label:'Importar planilha neste relatório', run: () => startImport(p.id, pid0(p))},
        {icon:'plus', label:'Adicionar item sem foto', run: async () => { const it = await createItem(p.id); go({name:'item', id: it.id}); }},
        {icon:'text', label:'Descrição padrão', run: () => promptSheet('Descrição padrão', 'Usada em itens novos e na importação quando a planilha não tem descrição', p.defaultDesc || '', 'Salvar', async v => { p.defaultDesc = v; await put('projects', p); toast('Descrição padrão salva.'); }, true)},
        {icon:'edit', label:'Renomear relatório', run: () => promptSheet('Renomear relatório', 'Título do relatório', p.name, 'Salvar', async v => { p.name = v; p.updatedAt = Date.now(); await put('projects', p); render(); })},
        {icon:'move', label:'Mover para…', run: () => moveSheet('project', p.id)},
        {icon:'trash', label:'Excluir relatório', danger:true, run: () => confirmSheet('Excluir relatório?', `“${p.name}”, todos os itens e fotos serão apagados deste aparelho.`, 'Excluir', async () => {
          const its = await byIdx('items', 'projectId', p.id), phs = await byIdx('photos', 'projectId', p.id);
          await delMany({projects:[p.id], items: its.map(x => x.id), photos: phs.map(x => x.id)}); go({name:'folder', id: pid0(p)}); })}
      ]); break;
    }
    case 'share': shareSheet(view.id); break;
    case 'add-item': { const it = await createItem(view.id); go({name:'item', id: it.id}); break; }
    case 'add-item-here': { const cur = await get('items', view.id); const it = await createItem(cur.projectId); go({name:'item', id: it.id}); break; }
    case 'next-pending': { const nx = (await byIdx('items', 'projectId', view.id)).sort(byOrder).find(x => !(x.photoIds || []).length); if (nx) go({name:'item', id: nx.id}); break; }
    case 'cam-new': camTarget = 'new'; $('#in-cam').value = ''; $('#in-cam').click(); break;
    case 'cam-add': camTarget = view.id; $('#in-cam').value = ''; $('#in-cam').click(); break;
    case 'gal-add': camTarget = view.id; $('#in-gal').value = ''; $('#in-gal').click(); break;
    case 'version': checkUpdate(true); break;
    case 'sketch': openSketch(id); break;
    case 'steps-sel': stepsSheet(await get('projects', view.id)); break;
    case 'add-meas': { await flushGuideFields(); const g = +b.dataset.g, t = b.dataset.t, its = await byIdx('items', 'projectId', view.id);
      const ns = vazMembers(its, g).filter(m => vazParse(m.step).t === t).map(m => vazParse(m.step).n); view['n' + g + t] = Math.max(1, ...ns, view['n' + g + t] || 0) + 1; render(); break; }
    case 'add-type': view.addT = [...(view.addT || []), b.dataset.g + b.dataset.t]; render(); break;
    case 'add-amb': { await flushGuideFields(); const p0 = await get('projects', view.id), its = await byIdx('items', 'projectId', view.id);
      const n = Math.max(p0.vazN || 1, ...its.map(i => vazParse(i.step)?.g || 0)) + 1; p0.vazN = n; await put('projects', p0);
      view.step = guideSteps(its, p0).findIndex(s => s.key === 'vaz_' + n); render(); break; }
    case 'croqui-new': croquiPick({pid: view.id}); break;
    case 'croqui-item': croquiPick({itemId: id}); break;
    case 'phedit': phEditSheet(id); break;
    case 'grilles': grillesSheet(); break;
    case 'calc-use': { const it = await ensureStepItem(view.id, b.dataset.key); it.fields = {...(it.fields || {}), v: b.dataset.val}; await put('items', it); toast('Vazão medida preenchida.'); render(); break; }
    case 'calc-all': { for (const it of (await byIdx('items', 'projectId', view.id)).filter(i => (i.step || '').startsWith('vaz_'))) { it.fields = {...(it.fields || {}), grelha: b.dataset.g}; await put('items', it); } toast('Grelha aplicada a todos os pontos.'); render(); break; }
    case 'guide': { const p0 = await get('projects', view.id); if (!p0.stepsSel) { stepsSheet(p0, () => document.querySelector('[data-act=guide]')?.click()); break; }
      const its = await byIdx('items', 'projectId', view.id), st = guideSteps(its, p0); const f = st.findIndex(s => !doneOf(s, its));
      go({name:'guide', id: view.id, step: f < 0 ? 0 : f}); break; }
    case 'na': { await flushGuideFields(); const key = b.dataset.key;
      promptSheet('Não se aplica', 'Justificativa (opcional)', '', 'Confirmar', async v => { const it = await ensureStepItem(view.id, key); it.na = true; it.naWhy = v; it.updatedAt = Date.now(); await put('items', it); view.step = (view.step || 0) + 1; render(); }, true); break; }
    case 'na-undo': { const it = await ensureStepItem(view.id, b.dataset.key); it.na = false; it.naWhy = ''; await put('items', it); render(); break; }
    case 'gres': { await flushGuideFields(); const it = await ensureStepItem(view.id, b.dataset.key); it.status = b.dataset.v === 'none' ? null : b.dataset.v; await put('items', it); render(); break; }
    case 'review': await flushGuideFields(); shareSheet(id); break;
    case 'zoom': { const ph = await get('photos', id); if (ph) zoomPhoto(phSrc(ph)); break; }
    case 'save-phone': await setSetting('savePhone', !(await getSetting('savePhone'))); render(); break;
    case 'gstep': await flushGuideFields(); view.step = (view.step || 0) + +b.dataset.d; render().then(() => window.scrollTo(0, 0)); break;
    case 'gseg': { await flushGuideFields(); const k = b.dataset.k, v = b.dataset.v; const it = b.dataset.id ? await get('items', b.dataset.id) : await ensureStepItem(view.id, b.dataset.key);
      it.fields = {...(it.fields || {}), [k]: it.fields?.[k] === v ? '' : v}; await put('items', it); render(); break; }
    case 'add-rep': { await flushGuideFields(); const base = b.dataset.base, p0 = await get('projects', view.id), its = await byIdx('items', 'projectId', view.id);
      const n = Math.max(1, its.filter(i => (i.step || '').startsWith(base + '_')).length) + 1; await ensureStepItem(view.id, base + '_' + n);
      const st = guideSteps(await byIdx('items', 'projectId', view.id), p0); view.step = st.findIndex(s => s.key === base + '_' + n); render(); break; }
    case 'pend-new': await flushGuideFields(); pendSheet(view.name === 'item' ? (await get('items', view.id)).projectId : view.id); break;
    case 'fill': go({name:'fill', id: view.id}); break;
    case 'fill-next': await flushGuideFields(); render(); break;
    case 'fill-skip': view.skip = [...(view.skip || []), id]; render(); break;
    case 'tfield': { const it = await get('items', view.id); it.fields = {...(it.fields || {})}; const k = b.dataset.k, v = b.dataset.v;
      it.fields[k] = it.fields[k] === v ? '' : v; it.updatedAt = Date.now(); await put('items', it); render(); break; }
    case 'status': { const it = await get('items', view.id); const v = b.dataset.v; it.status = it.status === v ? null : v; it.updatedAt = Date.now(); await put('items', it); render(); break; }
    case 'del-photo':
      confirmSheet('Excluir foto?', 'A foto será apagada deste item.', 'Excluir', async () => {
        const it = await get('items', view.id); it.photoIds = (it.photoIds || []).filter(x => x !== id);
        await put('items', it); await delMany({photos:[id]}); dropUrl('f' + id); dropUrl('t' + id); render(); }); break;
    case 'item-menu': {
      const it = await get('items', view.id);
      menu(it.title || 'Item', [
        {icon:'img', label:'Adicionar da galeria', run: () => { camTarget = it.id; $('#in-gal').value = ''; $('#in-gal').click(); }},
        {icon:'trash', label:'Excluir item', danger:true, run: () => confirmSheet('Excluir item?', `“${it.title || 'Sem título'}” e suas fotos serão apagados.`, 'Excluir', async () => {
          await delMany({items:[it.id], photos: it.photoIds || []}); go({name:'project', id: it.projectId}); })}
      ]); break;
    }
  }
});
document.addEventListener('act', e => { const fake = document.createElement('button'); fake.dataset.act = e.detail; fake.className = 'sr'; document.body.appendChild(fake); fake.click(); fake.remove(); });
document.addEventListener('input', e => {
  if (e.target.id === 'f-title') { const c = $('#f-count'); if (c) c.textContent = `${e.target.value.length}/100`; queueSave(); }
  if (e.target.id === 'f-desc') { const c = $('#d-count'); if (c) c.textContent = `${e.target.value.length}/1000`; queueSave(); }
  if (e.target.classList.contains('pnote')) queuePhotoNote(e.target.dataset.ph, e.target.value);
  if (e.target.classList.contains('gf')) queueGuideField(e.target);
  if (e.target.classList.contains('tf')) { queueSave(); if (e.target.dataset.fk === 'tr' || e.target.dataset.fk === 'ti') { const c = $('#calc-dt'); if (c) c.textContent = fieldValue({t:'calc'}, {tr: $('#tf-tr')?.value, ti: $('#tf-ti')?.value}) || '—'; } }
});
async function onPhotos(files){
  if (!files.length) return;
  getSetting('savePhone').then(on => { if (on) setTimeout(() => offerSavePhone(files), 1500); });
  toast('Salvando foto…', 30000);
  try {
    if (typeof camTarget === 'string' && camTarget.startsWith('step:')) { await flushGuideFields(); const it = await ensureStepItem(view.id, camTarget.slice(5)); await addPhotos(it.id, files); hideToast(); await render(); return; }
    if (camTarget === 'new') { const it = await createItem(view.id); await addPhotos(it.id, files); hideToast(); go({name:'item', id: it.id}); }
    else if (camTarget) { await addPhotos(camTarget, files); hideToast(); await render(); const strip = $('.photos'); if (strip) strip.scrollLeft = strip.scrollWidth; }
  } catch (err) { toast('Não foi possível salvar a foto: ' + err.message); }
}
$('#in-cam').addEventListener('change', e => onPhotos([...e.target.files]));
$('#in-gal').addEventListener('change', e => onPhotos([...e.target.files]));
$('#in-sheet').addEventListener('change', e => { const f = e.target.files[0]; if (f) handleSheetFile(f); });
let flogoTarget = null;
$('#in-plant').addEventListener('change', async e => { const f = e.target.files[0]; if (!f || !plantFolder) return;
  try { closeSheet(); await plantFromFile(f, plantFolder); plantsSheet(plantFolder); } catch (er) { hideToast(); toast('Não foi possível importar: ' + er.message, 4000); } });
document.addEventListener('change', async e => { const el = e.target; if (!el.dataset || el.dataset.actChange !== 'grelha') return;
  const it = await ensureStepItem(view.id, el.dataset.key); it.fields = {...(it.fields || {}), grelha: el.value}; await put('items', it);
  const p = await get('projects', view.id); p.lastGrille = el.value; await put('projects', p); render(); });
$('#in-flogo').addEventListener('change', async e => { const file = e.target.files[0]; if (!file || !flogoTarget) return;
  const {make} = await processImage(file); const r = await make(600, 1, 'image/png'); const f = await get('folders', flogoTarget);
  f.logo = {d: r.d, w: r.w, h: r.h}; await put('folders', f); toast('Logo do cliente salvo.'); });
$('#in-backup').addEventListener('change', e => { const f = e.target.files[0]; if (f) restoreBackup(f); });
document.addEventListener('visibilitychange', () => { if (document.hidden) saveFields(); });

/* ---------- início: volta para onde parou ---------- */
(async () => {
  try { navigator.storage?.persist?.(); } catch (e) {}
  try { if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js'); } catch (e) {}
  try {
    const last = await getSetting('lastView');
    if (last && ['home', 'pend', 'more'].includes(last.name)) view = {name: last.name};
    else if (last && last.name) {
      const store = last.name === 'folder' ? 'folders' : last.name === 'project' ? 'projects' : 'items';
      if (last.name === 'folder' && !last.id) view = {name:'folder', id:null};
      else if (last.id && await get(store, last.id)) view = {name: last.name, id: last.id};
    }
  } catch (e) {}
  await render();
  updateChip();
  cloudBoot().catch(e => console.warn('nuvem', e));
  setTimeout(() => checkUpdate(false), 3000);
})();
})();
</script>
</body>
</html>
